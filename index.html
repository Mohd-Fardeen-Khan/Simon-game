<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simon Game - Test Your Memory</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <div class="header">
        <h1 class="title">SIMON</h1>
        <p class="subtitle">Memory Challenge Game</p>
      </div>

      <!-- Stats Section -->
      <div class="stats-container">
        <div class="stat-box">
          <span class="stat-label">Current Level</span>
          <span class="stat-value" id="levelDisplay">0</span>
        </div>
        <div class="stat-box highlight">
          <span class="stat-label">🏆 High Score</span>
          <span class="stat-value" id="highScore">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Status</span>
          <span class="stat-value" id="statusDisplay">Ready</span>
        </div>
      </div>

      <!-- Game Board -->
      <div class="game-board">
        <div class="btn-container">
          <div class="top-row">
            <div class="btn yellow" id="yellow" type="button">
              <div class="btn-inner"></div>
            </div>
            <div class="btn green" id="green" type="button">
              <div class="btn-inner"></div>
            </div>
          </div>
          <div class="bottom-row">
            <div class="btn red" id="red" type="button">
              <div class="btn-inner"></div>
            </div>
            <div class="btn purple" id="purple" type="button">
              <div class="btn-inner"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button class="start-btn" id="startBtn">Start Game</button>
        <button class="reset-btn" id="resetBtn">Reset</button>
        <p class="instruction" id="instruction">
          Press Start to begin or any key on keyboard
        </p>
      </div>

      <!-- Message -->
      <div class="message-container">
        <p id="message" class="message"></p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
